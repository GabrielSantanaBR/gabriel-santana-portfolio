name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate JavaScript syntax
        run: |
          node --check script.js
          node --check effects.js
          node --check contact.js

      - name: Validate required files
        run: |
          for file in \
            index.html project.html prices.html contact.html thanks.html 404.html \
            styles.css video-effects.css backup-sites.css portfolio-proof.css \
            script.js effects.js contact.js robots.txt sitemap.xml SECURITY.md \
            .well-known/security.txt assets/favicon.svg assets/portfolio-preview.svg; do
            test -f "$file" || { echo "Missing required file: $file"; exit 1; }
          done

      - name: Validate local HTML references
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlsplit

          root = Path('.')
          broken = []

          class Links(HTMLParser):
              def __init__(self, source):
                  super().__init__()
                  self.source = source
              def handle_starttag(self, tag, attrs):
                  for key, value in attrs:
                      if key not in {'href', 'src'} or not value:
                          continue
                      if value.startswith(('http://','https://','#','mailto:','tel:','data:')):
                          continue
                      path = urlsplit(value).path
                      if not path:
                          continue
                      target = (self.source.parent / path).resolve()
                      if not target.exists():
                          broken.append(f'{self.source}: {value}')

          for html in root.glob('*.html'):
              parser = Links(html)
              parser.feed(html.read_text(encoding='utf-8'))

          if broken:
              raise SystemExit('Broken local references:\n' + '\n'.join(broken))
          print('Local references OK')
          PY

      - name: Validate CSP and safe markup
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          failures = []

          class Audit(HTMLParser):
              def __init__(self, source):
                  super().__init__()
                  self.source = source
                  self.csp = None
              def handle_starttag(self, tag, attrs):
                  data = dict(attrs)
                  if 'style' in data:
                      failures.append(f'{self.source}: inline style attribute')
                  if tag == 'script' and not data.get('src'):
                      failures.append(f'{self.source}: inline script')
                  if tag == 'a' and data.get('target') == '_blank':
                      rel = set((data.get('rel') or '').split())
                      if not {'noopener', 'noreferrer'} <= rel:
                          failures.append(f'{self.source}: target=_blank without noopener+noreferrer')
                  if tag == 'meta' and (data.get('http-equiv') or '').lower() == 'content-security-policy':
                      self.csp = data.get('content', '')

          for path in Path('.').glob('*.html'):
              audit = Audit(path)
              audit.feed(path.read_text(encoding='utf-8'))
              csp = audit.csp or ''
              required = [
                  "script-src 'self'",
                  "style-src 'self'",
                  "object-src 'none'",
                  "base-uri 'none'",
                  "frame-src 'none'",
                  'upgrade-insecure-requests',
              ]
              for directive in required:
                  if directive not in csp:
                      failures.append(f'{path}: CSP missing {directive}')
              if 'cdn.jsdelivr.net' in csp:
                  failures.append(f'{path}: external script CDN allowed in CSP')

          if failures:
              raise SystemExit('Security markup validation failed:\n' + '\n'.join(failures))
          print('CSP and markup OK')
          PY

      - name: Validate social sharing metadata
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          import xml.etree.ElementTree as ET

          EXPECTED_IMAGE = 'https://gabrielsantanabr.github.io/gabriel-santana-portfolio/assets/portfolio-preview.png'

          class MetaParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.meta = {}
              def handle_starttag(self, tag, attrs):
                  if tag != 'meta':
                      return
                  data = dict(attrs)
                  key = data.get('property') or data.get('name')
                  if key:
                      self.meta[key] = data.get('content', '')

          parser = MetaParser()
          parser.feed(open('index.html', encoding='utf-8').read())
          required = {
              'og:title': 'Gabriel Santana | Dados, IA e Desenvolvimento',
              'og:image': EXPECTED_IMAGE,
              'og:image:type': 'image/png',
              'og:image:width': '1200',
              'og:image:height': '630',
              'twitter:card': 'summary_large_image',
              'twitter:image': EXPECTED_IMAGE,
          }
          for key, expected in required.items():
              actual = parser.meta.get(key)
              if actual != expected:
                  raise SystemExit(f'{key} invalid: {actual!r}')

          root = ET.parse('assets/portfolio-preview.svg').getroot()
          if root.attrib.get('width') != '1200' or root.attrib.get('height') != '630':
              raise SystemExit('Social preview SVG must be exactly 1200x630')
          print('Social metadata and preview source OK')
          PY

      - name: Validate local-only visual runtime
        run: |
          if grep -Rni 'cdn.jsdelivr.net' --include='*.html' --include='*.js' .; then
            echo 'Third-party JavaScript runtime detected.'
            exit 1
          fi
          if grep -nE '^\s*import\s' effects.js; then
            echo 'effects.js must stay dependency-free.'
            exit 1
          fi
          grep -q 'prefers-reduced-motion' effects.js
          grep -q 'prefers-reduced-motion' video-effects.css
          grep -q 'prefers-reduced-motion' backup-sites.css
          grep -q 'backup-sites.css' video-effects.css
          grep -q 'nav-motion-pill' effects.js
          grep -q 'filter-motion-pill' effects.js

      - name: Validate contact security flow
        run: |
          grep -q 'id="secure-contact-form"' contact.html
          grep -q 'contact.js' contact.html
          grep -q "credentials: 'omit'" contact.js
          grep -q "referrerPolicy: 'no-referrer'" contact.js
          grep -q 'AbortController' contact.js
          grep -q 'botcheck' contact.html
          grep -q 'https://api.web3forms.com' contact.html

      - name: Validate sitemap and crawler files
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          ET.parse('sitemap.xml')
          robots = Path('robots.txt').read_text(encoding='utf-8')
          if 'Sitemap:' not in robots:
              raise SystemExit('robots.txt has no sitemap reference')
          security = Path('.well-known/security.txt').read_text(encoding='utf-8')
          for field in ('Contact:', 'Canonical:', 'Expires:'):
              if field not in security:
                  raise SystemExit(f'security.txt missing {field}')
          print('SEO and security metadata OK')
          PY

      - name: Check common committed secret patterns
        run: |
          if grep -RniE '(sk-[A-Za-z0-9_-]{20,}|ghp_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,}|AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{30,})' --exclude-dir=.git .; then
            echo 'Potential privileged secret detected.'
            exit 1
          fi

      - name: Check portfolio project routes
        run: |
          for id in clientflow decisionforge curtailment finance pricing institutional csv riftpilot; do
            grep -q "id=$id" index.html
            grep -q "$id:{" script.js
          done

  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build social preview PNG
        run: |
          if ! command -v rsvg-convert >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends librsvg2-bin
          fi
          rsvg-convert -w 1200 -h 630 assets/portfolio-preview.svg > assets/portfolio-preview.png
          python - <<'PY'
          import struct
          from pathlib import Path
          path = Path('assets/portfolio-preview.png')
          data = path.read_bytes()
          if data[:8] != b'\x89PNG\r\n\x1a\n':
              raise SystemExit('Generated social preview is not a PNG')
          width, height = struct.unpack('>II', data[16:24])
          if (width, height) != (1200, 630):
              raise SystemExit(f'Unexpected PNG dimensions: {width}x{height}')
          if path.stat().st_size < 10000:
              raise SystemExit('Generated social preview is unexpectedly small')
          print(f'Social preview OK: {width}x{height}, {path.stat().st_size} bytes')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
