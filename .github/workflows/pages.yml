name: Validate and deploy DataForge

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dataforge-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate JavaScript syntax
        run: |
          find . -maxdepth 1 -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Validate required DataForge files
        run: |
          for file in \
            index.html prices.html contact.html thanks.html 404.html \
            company.css company-pages.css company.js contact.js \
            robots.txt sitemap.xml SECURITY.md \
            assets/dataforge-d6.svg; do
            test -f "$file" || { echo "Missing required file: $file"; exit 1; }
          done

      - name: Validate local HTML references and duplicate IDs
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlsplit

          broken, duplicates = [], []

          class Audit(HTMLParser):
              def __init__(self, source):
                  super().__init__()
                  self.source = source
                  self.ids = set()

              def handle_starttag(self, tag, attrs):
                  data = dict(attrs)
                  element_id = data.get('id')
                  if element_id:
                      if element_id in self.ids:
                          duplicates.append(f'{self.source}: duplicate id={element_id}')
                      self.ids.add(element_id)

                  for key in ('href', 'src'):
                      value = data.get(key)
                      if not value or value.startswith(('http://', 'https://', '#', 'mailto:', 'tel:', 'data:')):
                          continue
                      path = urlsplit(value).path
                      if path and not (self.source.parent / path).resolve().exists():
                          broken.append(f'{self.source}: broken {key}={value}')

          for html in Path('.').glob('*.html'):
              parser = Audit(html)
              parser.feed(html.read_text(encoding='utf-8'))

          errors = broken + duplicates
          if errors:
              raise SystemExit('HTML integrity validation failed:\n' + '\n'.join(errors))
          print('HTML references and IDs OK')
          PY

      - name: Validate CSP and safe markup
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          failures = []

          class Audit(HTMLParser):
              def __init__(self, source):
                  super().__init__()
                  self.source = source
                  self.csp = None

              def handle_starttag(self, tag, attrs):
                  data = dict(attrs)
                  if 'style' in data:
                      failures.append(f'{self.source}: inline style')
                  if tag == 'script' and not data.get('src'):
                      failures.append(f'{self.source}: inline script')
                  if tag == 'a' and data.get('target') == '_blank':
                      rel = set((data.get('rel') or '').split())
                      if not {'noopener', 'noreferrer'} <= rel:
                          failures.append(f'{self.source}: unsafe target=_blank')
                  if tag == 'meta' and (data.get('http-equiv') or '').lower() == 'content-security-policy':
                      self.csp = data.get('content', '')

          for path in Path('.').glob('*.html'):
              audit = Audit(path)
              audit.feed(path.read_text(encoding='utf-8'))
              csp = audit.csp or ''
              for directive in (
                  "script-src 'self'",
                  "style-src 'self'",
                  "object-src 'none'",
                  "base-uri 'none'",
                  "frame-src 'none'",
                  'upgrade-insecure-requests',
              ):
                  if directive not in csp:
                      failures.append(f'{path}: CSP missing {directive}')

          if failures:
              raise SystemExit('Security markup validation failed:\n' + '\n'.join(failures))
          print('CSP and markup OK')
          PY

      - name: Validate DataForge identity
        run: |
          for file in index.html prices.html contact.html thanks.html; do
            grep -q 'DataForge' "$file"
            grep -q 'assets/dataforge-d6.svg' "$file"
            grep -q 'company.css' "$file"
          done
          grep -q 'Software · Data · AI' index.html
          grep -q 'Forjamos' index.html
          grep -q 'D6' assets/dataforge-d6.svg
          grep -q 'prefers-reduced-motion' company.css
          grep -q 'repo-filter' company.js
          grep -q 'IntersectionObserver' company.js

      - name: Validate public project repertoire
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          home = Path('index.html').read_text(encoding='utf-8')
          expected = (
              'decisionforge-ai',
              'curtailment-intelligence',
              'nossas-delicias-site',
              'projeto-petshop',
              'coffee_five_site',
              'projeto_academia',
              'projeto-barbearia',
              'clientflow',
              'finance-manager',
              'institutional-site-template',
              'hotmart_sites',
              'bakery-manager',
              'csv-sales-analyzer',
              'url-shortener-api',
              'riftpilot',
              'projeto_excel_DIO',
              'Pluvia',
              'Sicma-JAVA',
              'Conta_Bancaria',
              'Traducao_R_para_Python_UFF',
              'pequenos_projetos',
              'lab-natty-or-not',
              'dataforge-portfolio',
              'project-nomad',
              'LibreSprite',
          )

          for repo in expected:
              url = f'https://github.com/GabrielSantanaBR/{repo}'
              if url not in home:
                  raise SystemExit(f'Public project missing from repertoire: {repo}')

          count = len(re.findall(r'class="repo-item"', home))
          if count != len(expected):
              raise SystemExit(f'Expected {len(expected)} repertoire rows, found {count}')

          forks = len(re.findall(r'data-kind="fork"', home))
          if forks != 2:
              raise SystemExit(f'Expected 2 explicitly marked forks, found {forks}')

          if 'GabrielSantanaBR/GabrielSantanaBR' in home:
              raise SystemExit('Profile repository must not be presented as a project case')

          print(f'Public repertoire OK: {count} projects, {forks} forks identified')
          PY

      - name: Validate service catalog and contact mapping
        run: |
          grep -q 'SERVIÇOS & SOLUÇÕES' prices.html
          grep -q 'Agenda & CRM para Serviços' prices.html
          grep -q 'Sistema de Gestão Financeira' prices.html
          grep -q 'Sistema Personalizado / MVP' prices.html
          grep -q 'Catálogo, pedidos & ecommerce' prices.html
          grep -q 'Dashboard & Análise de Dados' prices.html
          grep -q 'Machine Learning & IA Aplicada' prices.html
          grep -q 'Deploy & preparação para produção' prices.html
          grep -q 'Revisão técnica & segurança' prices.html
          grep -q 'Analytics & instrumentação' prices.html

          python - <<'PY'
          from pathlib import Path

          prices = Path('prices.html').read_text(encoding='utf-8')
          contact = Path('contact.js').read_text(encoding='utf-8')
          keys = (
              'clientflow', 'finance', 'custom', 'vertical', 'landing', 'site',
              'site-panel', 'commerce', 'spreadsheet', 'data', 'ai', 'api',
              'deploy', 'security', 'analytics',
          )
          for key in keys:
              if f'?service={key}' not in prices:
                  raise SystemExit(f'Service CTA missing: {key}')
              token = f"{key}:" if '-' not in key else f"'{key}':"
              if token not in contact:
                  raise SystemExit(f'contact.js mapping missing: {key}')
          print('Service CTAs and contact mappings OK')
          PY

          grep -q 'id="secure-contact-form"' contact.html
          grep -q "credentials: 'omit'" contact.js
          grep -q "referrerPolicy: 'no-referrer'" contact.js
          grep -q 'AbortController' contact.js
          grep -q 'botcheck' contact.html
          grep -q 'https://api.web3forms.com' contact.html
          if grep -q 'id="budget"[^>]*required' contact.html; then
            echo 'Budget field must remain optional.'; exit 1
          fi

      - name: Validate DataForge SEO paths
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          base = 'https://gabrielsantanabr.github.io/dataforge-portfolio/'
          home = Path('index.html').read_text(encoding='utf-8')
          prices = Path('prices.html').read_text(encoding='utf-8')
          contact = Path('contact.html').read_text(encoding='utf-8')
          robots = Path('robots.txt').read_text(encoding='utf-8')

          if f'rel="canonical" href="{base}"' not in home:
              raise SystemExit('Home canonical is not DataForge Pages URL')
          if f'rel="canonical" href="{base}prices.html"' not in prices:
              raise SystemExit('Services canonical is not DataForge Pages URL')
          if f'rel="canonical" href="{base}contact.html"' not in contact:
              raise SystemExit('Contact canonical is not DataForge Pages URL')
          if f'Sitemap: {base}sitemap.xml' not in robots:
              raise SystemExit('robots.txt points to the wrong sitemap')

          tree = ET.parse('sitemap.xml')
          ns = {'sm': 'http://www.sitemaps.org/schemas/sitemap/0.9'}
          locs = {node.text for node in tree.findall('.//sm:loc', ns)}
          expected = {base, f'{base}prices.html', f'{base}contact.html'}
          if locs != expected:
              raise SystemExit(f'Unexpected sitemap URLs: {sorted(locs)}')
          print('SEO paths OK')
          PY

      - name: Check common committed secret patterns
        run: |
          if grep -RniE '(sk-[A-Za-z0-9_-]{20,}|ghp_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,}|AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{30,})' --exclude-dir=.git .; then
            echo 'Potential privileged secret detected.'; exit 1
          fi

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
