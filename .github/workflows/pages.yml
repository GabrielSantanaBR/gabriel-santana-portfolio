name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate JavaScript syntax
        run: |
          node --check script.js
          node --check effects.js
          node --check contact.js
          node --check product.js

      - name: Validate required files
        run: |
          for file in \
            index.html project.html prices.html contact.html thanks.html 404.html \
            clientflow.html decisionforge-ai.html curtailment-intelligence.html gestao-financeira.html \
            precificacao-vendas.html site-institucional-painel.html analise-vendas.html riftpilot.html \
            styles.css video-effects.css portfolio-proof.css identity.css pricing.css \
            script.js effects.js contact.js product.js robots.txt sitemap.xml SECURITY.md \
            .well-known/security.txt assets/favicon.svg assets/portfolio-social-v4.svg; do
            test -f "$file" || { echo "Missing required file: $file"; exit 1; }
          done

      - name: Validate local HTML references and duplicate IDs
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlsplit

          broken, duplicates = [], []

          class Audit(HTMLParser):
              def __init__(self, source):
                  super().__init__(); self.source = source; self.ids = set()
              def handle_starttag(self, tag, attrs):
                  data = dict(attrs)
                  element_id = data.get('id')
                  if element_id:
                      if element_id in self.ids:
                          duplicates.append(f'{self.source}: duplicate id={element_id}')
                      self.ids.add(element_id)
                  for key in ('href','src'):
                      value = data.get(key)
                      if not value or value.startswith(('http://','https://','#','mailto:','tel:','data:')):
                          continue
                      path = urlsplit(value).path
                      if path and not (self.source.parent / path).resolve().exists():
                          broken.append(f'{self.source}: {value}')

          for html in Path('.').glob('*.html'):
              parser = Audit(html); parser.feed(html.read_text(encoding='utf-8'))

          errors = broken + duplicates
          if errors:
              raise SystemExit('HTML integrity validation failed:\n' + '\n'.join(errors))
          print('HTML references and IDs OK')
          PY

      - name: Validate CSP and safe markup
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          failures=[]
          class Audit(HTMLParser):
              def __init__(self, source): super().__init__(); self.source=source; self.csp=None
              def handle_starttag(self, tag, attrs):
                  data=dict(attrs)
                  if 'style' in data: failures.append(f'{self.source}: inline style')
                  if tag=='script' and not data.get('src'): failures.append(f'{self.source}: inline script')
                  if tag=='a' and data.get('target')=='_blank':
                      rel=set((data.get('rel') or '').split())
                      if not {'noopener','noreferrer'} <= rel:
                          failures.append(f'{self.source}: unsafe target=_blank')
                  if tag=='meta' and (data.get('http-equiv') or '').lower()=='content-security-policy':
                      self.csp=data.get('content','')
          for path in Path('.').glob('*.html'):
              audit=Audit(path); audit.feed(path.read_text(encoding='utf-8')); csp=audit.csp or ''
              for directive in ("script-src 'self'","style-src 'self'","object-src 'none'","base-uri 'none'","frame-src 'none'",'upgrade-insecure-requests'):
                  if directive not in csp: failures.append(f'{path}: CSP missing {directive}')
          if failures: raise SystemExit('Security markup validation failed:\n'+'\n'.join(failures))
          print('CSP and markup OK')
          PY

      - name: Validate social metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          home=Path('index.html').read_text(encoding='utf-8')
          required=(
            'assets/portfolio-social-v4.jpg',
            'assets/portfolio-social-v4.png',
            'og:image:secure_url',
            'og:image:width',
            'og:image:height',
            'twitter:card',
            'twitter:image',
            'rel="image_src"'
          )
          for token in required:
              if token not in home: raise SystemExit(f'Social metadata missing: {token}')
          if 'portfolio-preview-v2.png' in home:
              raise SystemExit('Old social preview URL still present in home')
          print('Social metadata OK')
          PY

      - name: Validate clean identity system
        run: |
          grep -q 'Clean identity layer' identity.css
          grep -q 'Product pages' identity.css
          grep -q 'product-tabs' identity.css
          grep -q 'identity.css' index.html
          grep -q 'identity.css' prices.html
          grep -q 'pricing.css' prices.html
          grep -q 'identity.css' contact.html
          grep -q 'identity.css' clientflow.html
          grep -q 'prefers-reduced-motion' identity.css
          grep -q 'prefers-reduced-motion' effects.js

      - name: Validate dedicated product pages
        run: |
          for file in clientflow.html decisionforge-ai.html curtailment-intelligence.html gestao-financeira.html precificacao-vendas.html site-institucional-painel.html analise-vendas.html riftpilot.html; do
            grep -q 'data-product-page' "$file"
            grep -q 'product.js' "$file"
            grep -q 'product-tab' "$file"
            grep -q 'product-live-demo' "$file"
          done
          grep -q 'href="clientflow.html"' index.html
          grep -q 'href="decisionforge-ai.html"' index.html
          grep -q 'href="curtailment-intelligence.html"' index.html
          grep -q 'href="gestao-financeira.html"' index.html
          grep -q 'href="precificacao-vendas.html"' index.html
          grep -q 'href="site-institucional-painel.html"' index.html
          grep -q 'href="analise-vendas.html"' index.html
          grep -q 'href="riftpilot.html"' index.html
          if grep -q 'href="project.html?id=' index.html; then
            echo 'Legacy project query links returned to home.'; exit 1
          fi

      - name: Validate contact flow
        run: |
          grep -q 'id="secure-contact-form"' contact.html
          grep -q 'contact.js' contact.html
          grep -q "credentials: 'omit'" contact.js
          grep -q "referrerPolicy: 'no-referrer'" contact.js
          grep -q 'AbortController' contact.js
          grep -q 'botcheck' contact.html
          grep -q 'https://api.web3forms.com' contact.html

      - name: Validate sitemap
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          ET.parse('sitemap.xml')
          xml=Path('sitemap.xml').read_text(encoding='utf-8')
          for slug in ('clientflow.html','decisionforge-ai.html','curtailment-intelligence.html','gestao-financeira.html','precificacao-vendas.html','site-institucional-painel.html','analise-vendas.html','riftpilot.html'):
              if slug not in xml: raise SystemExit(f'Sitemap missing {slug}')
          print('Sitemap OK')
          PY

      - name: Check common committed secret patterns
        run: |
          if grep -RniE '(sk-[A-Za-z0-9_-]{20,}|ghp_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,}|AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{30,})' --exclude-dir=.git .; then
            echo 'Potential privileged secret detected.'; exit 1
          fi

  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build social preview assets
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin imagemagick
          rsvg-convert -w 1200 -h 630 assets/portfolio-social-v4.svg -o assets/portfolio-social-v4.png
          convert assets/portfolio-social-v4.png -strip -sampling-factor 4:2:0 -quality 88 assets/portfolio-social-v4.jpg
          identify assets/portfolio-social-v4.png
          identify assets/portfolio-social-v4.jpg

      - name: Validate generated social previews
        run: |
          python - <<'PY'
          from pathlib import Path
          import struct
          png=Path('assets/portfolio-social-v4.png')
          jpg=Path('assets/portfolio-social-v4.jpg')
          data=png.read_bytes()
          if data[:8] != b'\x89PNG\r\n\x1a\n': raise SystemExit('Generated PNG is invalid')
          width,height=struct.unpack('>II',data[16:24])
          if (width,height)!=(1200,630): raise SystemExit(f'Generated PNG has wrong dimensions: {width}x{height}')
          if jpg.read_bytes()[:2] != b'\xff\xd8': raise SystemExit('Generated JPEG is invalid')
          if png.stat().st_size < 15000 or jpg.stat().st_size < 15000: raise SystemExit('Generated social image is unexpectedly small')
          print('Generated social previews OK')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
