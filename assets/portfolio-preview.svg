      <text x="51" y="24" text-anchor="middle" fill="#9ce9c2">Python</text>
      <g transform="translate(114 0)"><rect width="104" height="38" rx="11" fill="#0d2117" stroke="#315f47"/><text x="52" y="24" text-anchor="middle" fill="#9ce9c2">FastAPI</text></g>
      <g transform="translate(230 0)"><rect width="100" height="38" rx="11" fill="#0d2117" stroke="#315f47"/><text x="50" y="24" text-anchor="middle" fill="#9ce9c2">Django</text></g>
