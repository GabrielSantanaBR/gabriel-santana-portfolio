<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Gabriel Santana — Dados, IA e Desenvolvimento</title>
  <desc id="desc">Capa social do portfólio com identidade verde escura, projetos de software, dados e inteligência artificial.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06110c"/>
      <stop offset="0.52" stop-color="#091a12"/>
      <stop offset="1" stop-color="#07110d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a7f4ce"/>
      <stop offset="0.5" stop-color="#67e0a7"/>
      <stop offset="1" stop-color="#35b67b"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10271b"/>
      <stop offset="1" stop-color="#0a1811"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#4be09a" stop-opacity=".28"/>
      <stop offset="1" stop-color="#4be09a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#6fe5ac" stroke-opacity=".045" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity=".34"/>
    </filter>
  </defs>

  <rect width="1200" height="630" rx="0" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="1040" cy="96" r="280" fill="url(#glow)"/>
  <circle cx="110" cy="590" r="220" fill="url(#glow)" opacity=".32"/>

  <g transform="translate(70 58)">
