      <rect width="382" height="78" rx="17" fill="#0b1c13" stroke="#284f3b"/>
      <rect x="15" y="15" width="48" height="48" rx="14" fill="#153726"/>
      <text x="39" y="45" text-anchor="middle" fill="#7ee8b3" font-size="17" font-weight="800">CF</text>
      <text x="82" y="32" fill="#effbf4" font-size="17" font-weight="700">ClientFlow</text>
      <text x="82" y="54" fill="#708a7d" font-size="12">Agenda • CRM • Atendimento</text>
