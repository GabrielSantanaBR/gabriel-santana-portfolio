  <path d="M70 575H1130" stroke="#6fe5ac" stroke-opacity=".14"/>
  <text x="70" y="600" fill="#547061" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="1">gabrielsantanabr.github.io/gabriel-santana-portfolio</text>
