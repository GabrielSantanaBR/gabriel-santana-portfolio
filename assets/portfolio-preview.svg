    <text x="37" y="47" text-anchor="middle" fill="#a7f4ce" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800">GS</text>
    <circle cx="57" cy="19" r="4" fill="#6fe5ac"/>
